name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Cari gradlew dan build
        run: |
          echo "Isi repo:"
          ls -R | head -n 100
          GRADLEW=$(find . -name "gradlew" -type f | head -n 1)
          echo "Ketemu di: $GRADLEW"
          if [ -z "$GRADLEW" ]; then
            echo "GAK KETEMU GRADLEW, struktur repo salah!"
            exit 1
          fi
          chmod +x $GRADLEW
          DIR=$(dirname $GRADLEW)
          cd $DIR
          ./gradlew assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-hasil
          path: |
            **/app/build/outputs/apk/debug/*.apk
            **/build/outputs/apk/debug/*.apk
